name: Refresh Job Dashboard

on:
  workflow_dispatch:  # manual trigger via API or GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          echo "APIFY_TOKEN=$APIFY_TOKEN" > .env
          python scraper.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html admin.html allocator_jobs.csv
          git diff --cached --quiet || git commit -m "Auto-refresh dashboard [skip ci]"
          git push
