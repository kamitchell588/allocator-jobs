name: Sync Apify tasks

# Builds the Apify tasks (named fram-*) from data/orgs.csv and the data/ filter files.
# Run it from the Actions tab: leave "apply" off for a dry run that only prints the plan.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create/update the tasks (leave off for a dry run)"
        type: boolean
        default: false
      only:
        description: "Only these tasks, comma-separated (e.g. fram-hedge-funds-1). Blank = all"
        type: string
        default: ""
      priority:
        description: "Priorities to include, comma-separated"
        type: string
        default: "P1"
      schedule:
        description: "Also create the daily schedule (turn on once a task's test run looks right)"
        type: boolean
        default: false
      backfill:
        description: "Also create fram-backfill-* twins: same firms, 6 months of postings, never scheduled (run each once by hand)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Sync tasks
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APPLY: ${{ inputs.apply }}
          ONLY: ${{ inputs.only }}
          SCHEDULE: ${{ inputs.schedule }}
          PRIORITY: ${{ inputs.priority }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          args=""
          [ "$APPLY" = "true" ] && args="$args --apply"
          [ "$SCHEDULE" = "true" ] && args="$args --schedule"
          [ "$BACKFILL" = "true" ] && args="$args --backfill"
          [ -n "$PRIORITY" ] && args="$args --priority $PRIORITY"
          [ -n "$ONLY" ] && args="$args --only $ONLY"
          python sync_apify_tasks.py $args
