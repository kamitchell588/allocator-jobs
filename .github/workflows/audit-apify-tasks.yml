name: Audit Apify tasks

# Read-only. Once a day (or from the Actions tab) lists which Apify tasks/schedules cover each firm
# and saves it to data/task_map.csv. Changes nothing in Apify.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python audit_apify_tasks.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/task_map.csv
          git diff --cached --quiet || (git commit -m "Update task map [skip ci]" && git pull --rebase origin main && git push)
